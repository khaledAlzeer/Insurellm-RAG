[project]
name = "insurellm-rag"
version = "0.1.0"
description = "A modular, local-first RAG knowledge assistant for the Insurellm Knowledge Base"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "gradio>=6.0,<7",
    "chromadb>=1.0,<2",
    "sentence-transformers>=3.0,<6",
    "ollama>=0.4",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "torch>=2.14.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insurellm_rag"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs a live Ollama service, real models and a real Knowledge Base (deselected by default)"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
